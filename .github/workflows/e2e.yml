name: e2e

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  playwright:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-food
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm build --filter=ai-food
        env:
          CI: true
          VITE_AI_GATEWAY_URL: http://127.0.0.1:3000
          VITE_AI_GATEWAY_API_KEY: e2e-ci-key
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/ai-food/test-results
          retention-days: 7
