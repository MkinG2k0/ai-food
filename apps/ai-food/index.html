<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09AF86" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Food" />
    <title>AI Food — дневник питания</title>
    <style>
      /* Instant paint before CSS/JS — brand splash; theme script may override */
      html,
      body {
        margin: 0;
        background: #09AF86;
      }
      html.dark,
      html.dark body {
        background: #09090b;
      }
      html.theme-forest,
      html.theme-forest body {
        background: #0c1411;
      }
    </style>
    <!-- Apply saved theme before paint to avoid light/dark flicker -->
    <script>
      (function () {
        try {
          var key = 'ai-food-theme';
          var pref = localStorage.getItem(key) || 'system';
          var root = document.documentElement;
          root.classList.remove('dark', 'theme-forest');
          var resolved = pref;
          if (pref === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          if (resolved === 'dark') root.classList.add('dark');
          else if (resolved === 'forest') root.classList.add('dark', 'theme-forest');
          var darkUi = resolved === 'dark' || resolved === 'forest';
          root.style.colorScheme = darkUi ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            var bg =
              resolved === 'forest'
                ? '#0c1411'
                : resolved === 'dark'
                  ? '#09090b'
                  : '#09AF86';
            meta.setAttribute('content', bg);
          }
        } catch (e) {}
      })();
    </script>
    <!-- Capture beforeinstallprompt before the JS bundle loads (Yandex/Chrome may fire early). -->
    <script>
      window.__aifoodPwa = { deferred: null };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__aifoodPwa.deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__aifoodPwa.deferred = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
