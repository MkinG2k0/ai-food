<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#30ad54" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AI Food" />
    <title>AI Food — дневник питания</title>
    <!-- Capture beforeinstallprompt before the JS bundle loads (Yandex/Chrome may fire early). -->
    <script>
      window.__aifoodPwa = { deferred: null };
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__aifoodPwa.deferred = e;
      });
      window.addEventListener('appinstalled', function () {
        window.__aifoodPwa.deferred = null;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
