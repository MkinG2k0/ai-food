# Nixpacks (Dokploy) — when Build Path = `/` and this app is selected via
# NIXPACKS_TURBO_APP_NAME=openrouter-gateway
#
# Prefer Dockerfile for production: apps/ai-app/Dockerfile (context `.`).

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm exec turbo run build --filter=openrouter-gateway"]

[start]
cmd = "pnpm --filter openrouter-gateway run start:prod"
